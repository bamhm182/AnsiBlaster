{% if playbooks %}
  {% for name, roles in playbooks.items() %}
    <div class="playbook-item" data-filter-name="{{ name }}">
      <input type="checkbox" name="playbooks" value="{{ name }}" id="playbook-{{ name }}" form="apply-form" hidden>
      <button
        type="button"
        class="list-item playbook-button"
        data-playbook="{{ name }}"
        data-roles="{{ roles | tojson }}"
        onclick="applyPlaybook(this)"
      >
        <span class="list-item-name">{{ name }}</span>
        <span class="list-item-arrow" aria-hidden="true">&#9656;</span>
      </button>
    </div>
  {% endfor %}
{% else %}
  <p class="empty-hint">No playbooks found.</p>
{% endif %}
