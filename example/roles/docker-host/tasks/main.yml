---
- name: Install Docker
  # docker_package_name comes from meta/argument_specs.yml -- fillable/autofilled in the
  # Deploy column's Variables area (see CLAUDE.md's "Role variables (argument_specs)" section).
  # Defaults to docker.io, Ubuntu's own repo package -- keeps this example free of an extra
  # apt_key/apt_repository step to add Docker's official upstream repo.
  ansible.builtin.apt:
    name: "{{ docker_package_name }}"
    state: present
    update_cache: true

- name: Ensure Docker is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add the connecting user to the docker group
  # Lets that user run docker without sudo -- takes effect on their next login/session, not
  # immediately. Skipped for root, which already has full access.
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
  when: ansible_user != "root"
