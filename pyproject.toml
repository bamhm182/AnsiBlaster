[project]
name = "ansiblaster"
version = "0.1.0"
description = "Web UI for selecting Ansible roles/playbooks and applying them to a target host, with a live log."
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "ansible-core>=2.19.11",
    "ansible-runner>=2.4.3",
    "fastapi>=0.141.1",
    "jinja2>=3.1.6",
    "markupsafe>=3.0.3",
    "pydantic-settings[yaml]>=2.14.2",
    "pypsrp>=0.9.1",
    "python-multipart>=0.0.32",
    "pywinrm>=0.5.0",
    "sqlalchemy>=2.0",
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.4.0",
    "ruff>=0.6",
]

[project.scripts]
ansiblaster = "ansiblaster.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ansiblaster"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Global per-test watchdog: the full suite normally finishes in a few seconds, so 60s is
# generous headroom, not a tight budget. This exists purely so a hang (like the one that once
# stuck the GitHub Actions "Run tests" step for 20+ minutes with zero output) fails loudly with
# a full thread dump (every thread's traceback, via faulthandler -- ansible-runner and its
# callbacks run on their own background threads, not just the asyncio event loop's) instead of
# silently consuming the whole job. "signal" (the default on POSIX, which the CI runner and any
# real dev machine both are) is a bare SIGALRM -- it can interrupt a blocked syscall (e.g. a
# stuck DNS lookup), unlike the "thread" method, which can only dump-and-report, never actually
# unblock the offending call.
timeout = 60

[tool.ruff]
line-length = 100

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom is `param: T = Depends(...)` -- a function call in a
# default argument is deliberate here, not the mutable-default footgun B008 otherwise guards
# against, so treat it (and Query/etc.) as an allowed "immutable" call.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
